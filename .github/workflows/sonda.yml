name: Sonda SerpApi (diagnostico)
on:
  push:
    branches: ["diag/**"]
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: |
          mkdir -p diag/saida
          python diag/serpapi.py 2>&1 | sed 's/api_key=[^& ]*/api_key=***/g' | tee diag/saida/serpapi.txt
      - run: |
          git config user.name "jobradar"
          git config user.email "actions@github.com"
          git add -f diag/saida
          git commit -qm "sonda: serpapi" && git push
