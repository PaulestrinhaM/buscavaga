name: Sonda de fontes (diagnostico)

on:
  push:
    branches: ["diag/**"]

permissions:
  contents: write

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python diag/sonda.py
      - name: Devolver a saida como commit
        run: |
          git config user.name "jobradar"
          git config user.email "actions@github.com"
          git add -f diag/saida diag/saida2
          git commit -qm "sonda: saida" && git push
