name: JobRadar

on:
  schedule:
    # De hora em hora, no minuto 17: o GitHub atrasa e as vezes descarta disparos
    # agendados, principalmente na hora cheia. Cada disparo decide o que fazer
    # (python main.py --agendado): roda a coleta se a do turno atual (07h, 12h ou 18h de
    # Brasilia, em config.HORARIOS_CICLO) ainda nao rodou; senao, so o stand-by. Disparo
    # perdido e coberto pelo seguinte, e a Adzuna continua com no maximo 3 coletas/dia.
    - cron: "17 * * * *"
  workflow_dispatch:          # botao "Run workflow": coleta completa na hora
  push:
    branches: [main]          # no push roda so os testes

permissions:
  contents: write             # necessario para versionar o banco

concurrency:
  group: radar                # duas execucoes ao mesmo tempo disputariam o banco
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q

  radar:
    needs: testes             # teste quebrado nao roda o radar
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      # agendado: coleta do turno se faltar, senao stand-by. Manual: coleta na hora.
      # Na coleta, score 8+ sai na hora e o restante (5+) vai no resumo logo depois.
      - name: Coleta ou stand-by
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python main.py && python main.py --resumo
          else
            python main.py --agendado
          fi

      # todas as vagas da coleta, com a etapa e o motivo de cada descarte
      - name: Anexar planilha do ciclo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vagas-do-ciclo
          path: saida/vagas-do-ciclo.csv
          retention-days: 30
          if-no-files-found: ignore

      - name: Versionar o banco
        if: always()          # grava o que foi visto mesmo se o resumo falhar
        run: |
          git config user.name "jobradar"
          git config user.email "actions@github.com"
          git add data/jobs.db
          git diff --staged --quiet && exit 0
          git commit -m "radar: $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase -q
          git push
