name: JobRadar

on:
  schedule:
    # 07h, 12h e 18h de Brasilia (UTC-3, sem horario de verao); o GitHub pode atrasar
    # alguns minutos. Nao passar de 3 por dia: com 24 chamadas por ciclo, a quarta
    # execucao deixaria a Adzuna no limite mensal do plano gratuito (2.500).
    - cron: "0 10,15,21 * * *"
    # stand-by: nova tentativa da IA sobre vagas que ela nao conseguiu avaliar.
    # Hora cheia + 30, fora da coleta. Com a fila vazia termina em segundos.
    - cron: "30 * * * *"
  workflow_dispatch:          # botao "Run workflow" na aba Actions, para rodar na hora
  push:
    branches: [main]          # no push roda so os testes

permissions:
  contents: write             # necessario para versionar o banco

concurrency:
  group: radar                # duas execucoes ao mesmo tempo disputariam o banco
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q

  radar:
    needs: testes             # teste quebrado nao roda o radar
    if: github.event_name != 'push' && github.event.schedule != '30 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      # score 8+ sai na hora, uma mensagem por vaga
      - name: Ciclo de coleta
        run: python main.py

      # o restante (score 5+) sai num resumo logo em seguida
      - name: Resumo
        run: python main.py --resumo

      # todas as vagas do ciclo, com a etapa e o motivo de cada descarte
      - name: Anexar planilha do ciclo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vagas-do-ciclo
          path: saida/vagas-do-ciclo.csv
          retention-days: 30
          if-no-files-found: ignore

      - name: Versionar o banco
        if: always()          # grava o que foi visto mesmo se o resumo falhar
        run: |
          git config user.name "jobradar"
          git config user.email "actions@github.com"
          git add data/jobs.db
          git diff --staged --quiet || git commit -m "radar: ciclo $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase -q
          git push

  standby:
    if: github.event.schedule == '30 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Nova tentativa do stand-by
        run: python main.py --standby

      - name: Versionar o banco
        run: |
          git config user.name "jobradar"
          git config user.email "actions@github.com"
          git add data/jobs.db
          git diff --staged --quiet && exit 0
          git commit -m "radar: stand-by $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase -q
          git push
